[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vacuole-aware-myelin-mvp"
version = "0.1.0"
description = "Semi-automatic vacuole-aware myelin measurement pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "matplotlib>=3.8",
]

[project.scripts]
myelin-mvp = "mvp_pipeline.cli:main"

[project.optional-dependencies]
annotation = ["napari[pyqt6,optional]==0.9.0", "qtpy>=2.4"]
test = ["pytest>=8"]
whole-image = ["AxonDeepSeg==5.3.0"]
full = [
  "AxonDeepSeg==5.3.0",
  "napari[pyqt6,optional]==0.9.0",
  "qtpy>=2.4",
  "pytest>=8",
]

[tool.setuptools]
packages = ["mvp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=work/pytest_tmp"
